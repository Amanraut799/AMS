services:
  - type: web
    name: attendpro-api
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./attendance-backend/Dockerfile
    dockerContext: ./attendance-backend
    envVars:
      - key: DB_URL
        sync: false
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: APP_TIME_ZONE
        value: Asia/Kolkata
      - key: APP_CORS_ALLOWED_ORIGINS
        sync: false
      - key: APP_PASSWORD_RESET_URL
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: MAIL_FROM
        sync: false
      - key: SHOW_SQL
        value: "false"

  - type: web
    name: attendpro-frontend
    runtime: static
    buildCommand: cd frontend && npm ci && npm run build
    staticPublishPath: ./frontend/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        sync: false
