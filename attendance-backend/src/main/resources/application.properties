spring.application.name=attendance-backend
app.time-zone=${APP_TIME_ZONE:Asia/Kolkata}

server.port=${PORT:8080}

# ===============================
# MySQL Database
# ===============================
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/attendpro?useSSL=false&serverTimezone=Asia/Kolkata&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD}

# ===============================
# JPA / Hibernate
# ===============================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=${SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=${FORMAT_SQL:false}

# ===============================
# Security
# ===============================
#spring.security.user.name=admin
#spring.security.user.password=admin

# ===============================
# JSON
# ===============================
spring.jackson.time-zone=Asia/Kolkata

# JWT
jwt.secret=${JWT_SECRET}
jwt.expiration=86400000

# Password reset email (set these environment variables to enable employee resets)
spring.mail.host=${MAIL_HOST:}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
app.mail.from=${MAIL_FROM:no-reply@attendpro.local}
app.password-reset-url=${APP_PASSWORD_RESET_URL:http://localhost:5173/reset-password}
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173}

# Optional one-time initial admin creation; remove these environment values after first successful boot.
app.bootstrap-admin.email=${BOOTSTRAP_ADMIN_EMAIL:}
app.bootstrap-admin.password=${BOOTSTRAP_ADMIN_PASSWORD:}
app.bootstrap-admin.first-name=${BOOTSTRAP_ADMIN_FIRST_NAME:AttendPro}
app.bootstrap-admin.last-name=${BOOTSTRAP_ADMIN_LAST_NAME:Admin}
